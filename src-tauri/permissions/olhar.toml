# Registrar invoke_handler não basta para a página remota: o comando precisa
# de uma permissão explícita. O handler ainda valida janela e consentimento.
[[permission]]
identifier = "allow-olhar-computador"
description = "Permite consultar, autorizar e parar Olhar nas janelas autorizadas."
commands.allow = ["olhar_computador"]

[[permission]]
identifier = "allow-explorar-computador"
description = "Sessão de aprendizado autorizada no computador."
commands.allow = ["explorar_computador"]
