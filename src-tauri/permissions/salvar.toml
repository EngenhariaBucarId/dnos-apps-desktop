# Salvar como… do vídeo final do dn.estudio (0.8.18): a página publicada pede a janela nativa de salvar e a casca
# baixa o vídeo para o caminho escolhido pela pessoa.
[[permission]]
identifier = "allow-salvar"
description = "Abrir a janela de salvar e gravar o vídeo final ou qualquer arquivo do dn.os (0.8.19) onde a pessoa escolher; mostrar o último arquivo na pasta."
commands.allow = ["salvar_video", "salvar_arquivo", "salvar_mostrar"]
