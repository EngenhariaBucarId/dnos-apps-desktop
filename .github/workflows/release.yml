# Gera os instaladores do dn.os Desktop a cada tag `v*` e publica no GitHub
# Releases, com o `latest.json` que o updater das cascas instaladas consulta.
#
# Mac: assinado com certificado próprio (auto-assinado, estável entre versões)
# — ver o passo "Certificado de assinatura do Mac". Apple Developer ID entra
# depois; Windows segue sem assinatura (aviso na primeira abertura, ver README).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# Publicar só quando as TRÊS plataformas ficarem prontas (20/09/2026). Antes,
# cada job publicava por conta própria: na v0.8.1 o Mac caiu numa falha de rede
# ao subir os arquivos e a release foi ao ar sem `.dmg` e com um `latest.json`
# que anunciava 0.8.1 sem nenhuma entrada `darwin` — para quem usa Mac, uma
# versão que não existe e um atualizador que não acha nada.
#
# Agora: um rascunho é criado antes, os três jobs sobem os arquivos nele, e só
# depois de todos passarem (e de conferirmos que os instaladores das três
# plataformas estão lá) o rascunho vira release pública.
jobs:
  rascunho:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.r.outputs.result }}
    steps:
      - uses: actions/github-script@v7
        id: r
        with:
          result-encoding: string
          script: |
            if (!context.ref.startsWith("refs/tags/")) {
              throw new Error("A release nasce de uma tag v*. Rode o fluxo a partir da tag.");
            }
            const tag = context.ref.replace("refs/tags/", "");
            const { owner, repo } = context.repo;
            const notas = [
              "Instaladores do dn.os Desktop. Mac: baixe o `.dmg`. Windows: baixe o `-setup.exe`. Linux: `.AppImage` (qualquer distro), `.deb` (Ubuntu/Debian) ou `.rpm` (Fedora).",
              "Primeira abertura sem assinatura: veja o README do repositório.",
            ].join("\n");
            const todas = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            const existente = todas.find((r) => r.tag_name === tag);
            if (existente) {
              // Reexecução: volta ao estado de rascunho até tudo passar de novo.
              await github.rest.repos.updateRelease({ owner, repo, release_id: existente.id, draft: true });
              return String(existente.id);
            }
            const nova = await github.rest.repos.createRelease({
              owner, repo, tag_name: tag, name: `dn.os Desktop ${tag}`,
              body: notas, draft: true, prerelease: false,
            });
            return String(nova.data.id);

  build:
    needs: rascunho
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""
          # Linux (11/09): .deb, .rpm e .AppImage. Ubuntu 22.04 de propósito: o
          # AppImage gerado num Ubuntu mais novo exige glibc que máquinas de
          # trabalho ainda não têm.
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # Dependências do Tauri 2 e do cpal (microfone do Aprenda comigo) no Linux.
      - name: Dependências do Linux
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Ajudante do gravador da máquina (Swift, universal): embutido na casca
      # por include_bytes! em maquina.rs. Só no Mac.
      - name: Ajudante gravador-mac (Swift)
        if: startsWith(matrix.platform, 'macos')
        run: bash src-tauri/ajudantes/compilar.sh

      # Ajudante do computador no Windows (Rust): embutido na casca por include_bytes!
      # em exploracao.rs e maquina.rs. Só no Windows.
      - name: Ajudante computador-win (Rust)
        if: startsWith(matrix.platform, 'windows')
        shell: bash
        run: |
          cargo build --release --manifest-path src-tauri/ajudantes/computador-win/Cargo.toml
          cp src-tauri/ajudantes/computador-win/target/release/dnos-computador-win.exe src-tauri/ajudantes/dnos-computador-win.exe
          ls -la src-tauri/ajudantes/dnos-computador-win.exe
          src-tauri/ajudantes/dnos-computador-win.exe --permissoes

      - run: npm ci

      # Assinatura do Mac com certificado PRÓPRIO (13/09): auto-assinado, o mesmo
      # em toda versão. O macOS guarda Acessibilidade, Tela e Microfone pela
      # impressão digital do assinante; com "ad hoc" cada versão era um app novo
      # e a pessoa religava tudo a cada atualização. O Gatekeeper continua
      # pedindo "abrir com botão direito" na primeira instalação (não é Apple).
      # Chave: secrets DNOS_MAC_CERT_P12 (base64) e DNOS_MAC_CERT_SENHA; o
      # certificado público fica em src-tauri/assinatura/dn-os-desktop.pem.
      - name: Certificado de assinatura do Mac
        if: startsWith(matrix.platform, 'macos')
        env:
          CERT_P12_B64: ${{ secrets.DNOS_MAC_CERT_P12 }}
          CERT_SENHA: ${{ secrets.DNOS_MAC_CERT_SENHA }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/dnos.keychain-db"
          KCPW="$(openssl rand -hex 16)"
          echo "$CERT_P12_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_SENHA" -T /usr/bin/codesign -T /usr/bin/security
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain src-tauri/assinatura/dn-os-desktop.pem
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
          # Prova antes do build: assina um binário pequeno e mostra o requisito designado.
          cp /usr/bin/true "$RUNNER_TEMP/prova"
          codesign --force --sign "dn.os Desktop" "$RUNNER_TEMP/prova"
          codesign -dr - "$RUNNER_TEMP/prova"
          rm -f "$RUNNER_TEMP/cert.p12"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Assinatura do UPDATER (obrigatória): a casca só aceita atualização
          # assinada com esta chave. Gerada com `tauri signer generate`.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Identidade do certificado próprio (passo acima). Com Apple Developer,
          # trocar por APPLE_CERTIFICATE/APPLE_CERTIFICATE_PASSWORD/APPLE_SIGNING_IDENTITY
          # + APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID (notarização) e tirar o passo.
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.platform, 'macos') && 'dn.os Desktop' || '' }}
        with:
          # Sobe para o rascunho criado antes; quem publica é o job "publicar".
          releaseId: ${{ needs.rascunho.outputs.id }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  publicar:
    # Só roda se os três jobs da matriz passarem — um "needs" de matriz falha
    # inteiro quando qualquer perna falha, mesmo com fail-fast: false.
    needs: [rascunho, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const release_id = Number("${{ needs.rascunho.outputs.id }}");
            const rel = await github.rest.repos.getRelease({ owner, repo, release_id });
            const nomes = rel.data.assets.map((a) => a.name);
            // Cinto e suspensório: os jobs passaram, mas a release ainda pode
            // estar incompleta se um upload silencioso falhar.
            const precisa = [
              [/\.dmg$/, "instalador do Mac (.dmg)"],
              [/app\.tar\.gz$/, "pacote de atualização do Mac (.app.tar.gz)"],
              [/-setup\.exe$/, "instalador do Windows (-setup.exe)"],
              [/\.msi$/, "instalador do Windows (.msi)"],
              [/\.AppImage$/, "AppImage do Linux"],
              [/\.deb$/, "pacote .deb"],
              [/\.rpm$/, "pacote .rpm"],
              [/^latest\.json$/, "latest.json do atualizador"],
            ];
            const faltando = precisa.filter(([rx]) => !nomes.some((n) => rx.test(n))).map(([, o]) => o);
            if (faltando.length) {
              throw new Error(`Release incompleta, continua como rascunho. Falta: ${faltando.join(", ")}. Presentes: ${nomes.join(", ")}`);
            }
            await github.rest.repos.updateRelease({ owner, repo, release_id, draft: false });
            core.info(`Publicada com ${nomes.length} arquivos.`);
