# Gera os instaladores do dn.os Desktop a cada tag `v*` e publica no GitHub
# Releases, com o `latest.json` que o updater das cascas instaladas consulta.
#
# Assinatura de código (Apple Developer ID / Windows) entra depois, por
# secrets — sem eles o build sai sem assinatura e o sistema mostra o aviso
# na primeira abertura (ver README).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""
          # Linux (11/09): .deb, .rpm e .AppImage. Ubuntu 22.04 de propósito: o
          # AppImage gerado num Ubuntu mais novo exige glibc que máquinas de
          # trabalho ainda não têm.
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # Dependências do Tauri 2 e do cpal (microfone do Aprenda comigo) no Linux.
      - name: Dependências do Linux
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Assinatura do UPDATER (obrigatória): a casca só aceita atualização
          # assinada com esta chave. Gerada com `tauri signer generate`.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Assinatura de código da Apple: NÃO declarar estas variáveis enquanto
          # não houver conta. Vazias, a action tenta importar um certificado
          # vazio e o build do Mac falha ("failed to import keychain certificate").
          # Quando a conta existir, acrescentar aqui:
          #   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
          #   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID (todos via secrets).
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "dn.os Desktop ${{ github.ref_name }}"
          releaseBody: |
            Instaladores do dn.os Desktop. Mac: baixe o `.dmg`. Windows: baixe o `-setup.exe`. Linux: `.AppImage` (qualquer distro), `.deb` (Ubuntu/Debian) ou `.rpm` (Fedora).
            Primeira abertura sem assinatura: veja o README do repositório.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
