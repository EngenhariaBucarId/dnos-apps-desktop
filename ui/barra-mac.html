<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>dn.os</title>
<style>
html,body{margin:0;background:transparent;font:13px Sora,Inter,-apple-system,system-ui,sans-serif;color:#F0F4FF;-webkit-user-select:none;user-select:none;overflow:hidden}
.b{display:flex;align-items:center;gap:10px;height:56px;padding:0 12px 0 14px;background:rgba(11,21,38,.96);border:1px solid rgba(61,97,255,.35);border-radius:14px;box-shadow:0 12px 40px -12px rgba(0,0,0,.7)}
.p{width:9px;height:9px;border-radius:50%;background:#3D61FF;box-shadow:0 0 0 0 rgba(61,97,255,.5);animation:pulso 1.4s ease-out infinite;flex:none}
@keyframes pulso{70%{box-shadow:0 0 0 10px rgba(61,97,255,0)}100%{box-shadow:0 0 0 0 rgba(61,97,255,0)}}
.t{min-width:0;flex:1}.t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.t span{display:block;font-size:11px;color:#A8B3C7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{all:unset;cursor:pointer;background:#E41A11;color:#fff;font-weight:600;font-size:12px;padding:7px 12px;border-radius:999px;flex:none}
button:hover{background:#ff2a20}
.esc{font-size:10px;color:#748198;flex:none}
</style></head><body>
<div class="b"><i class="p"></i><div class="t"><b id="t">dn.os está usando o seu Mac</b><span id="s">preparando…</span></div><span class="esc">Esc Esc para parar</span><button id="parar">Parar</button></div>
<script>
(async () => {
  const ev = window.__TAURI__ && window.__TAURI__.event;
  if (!ev) return;
  await ev.listen("dnos://barra-mac", (e) => {
    const p = e.payload || {};
    document.getElementById("t").textContent = (p.agente ? p.agente + " está usando o seu Mac" : "dn.os está usando o seu Mac") + (p.titulo ? " · " + p.titulo : "");
    document.getElementById("s").textContent = p.sub || "";
  });
  document.getElementById("parar").onclick = () => ev.emit("dnos://roteiro/parar", {});
})();
</script></body></html>
