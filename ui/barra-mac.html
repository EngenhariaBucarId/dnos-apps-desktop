<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>dn.os</title>
<!--
  Barra flutuante do "Usar meu computador" (17/09/2026).

  Serve aos DOIS lados do recurso, e o modo muda quem manda parar:
    · atuando    — o agente executa um roteiro; Parar interrompe a execução.
    · assistindo — a pessoa demonstra e o agente assiste; Parar encerra a gravação.
    · reuniao    — o microfone DESTA máquina está aberto numa reunião (20/09);
                   Parar encerra e entrega a transcrição ao agente.
    · meet       — o agente está numa sala do Meet, pelo Chrome dele; Parar tira
                   ele da sala. Aqui nenhum microfone desta máquina está aberto.

  Design: Luxury Intelligence (tokens --lux-* do dn.os). Glow é funcional, só
  marca o que está vivo — nunca enfeite. Vermelho só no Parar, que é a única
  ação destrutiva daqui.

  Fala "seu computador", nunca "seu Mac": o recurso também vai para Windows.

  01/10: arrasta para qualquer lugar; na reunião (reuniao/meet) minimiza numa
  bolinha no canto direito com a foto do agente e o anel de gravando. Quem
  muda o tamanho e o lugar da janela é a casca (barra_posicao.rs); aqui só
  avisamos. Agente usando o computador não minimiza: o Parar fica à mão.
-->
<style>
  :root{
    --fundo: rgba(8,13,26,.97);
    --superficie-2: #101B2F;
    --texto: #F0F4FF;
    --texto-fraco: #8FA3C7;
    --borda-neutra: rgba(143,163,199,.14);
    --borda-primaria: rgba(61,97,255,.45);
    --primaria: #3D61FF;
    --ia: #8A5CFF;
    --glow: rgba(61,97,255,.18);
    --glow-ia: rgba(138,92,255,.16);
    --destrutiva: #E41A11;
  }
  html,body{margin:0;background:transparent;overflow:hidden;-webkit-user-select:none;user-select:none;
    font:13px Inter,-apple-system,"Segoe UI",system-ui,sans-serif;color:var(--texto)}

  .barra{display:flex;align-items:center;gap:11px;height:56px;padding:0 10px 0 12px;
    background:var(--fundo);border:1px solid var(--borda-neutra);border-radius:16px;
    box-shadow:0 16px 44px -16px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.02) inset}
  /* Atuando: a borda acende no azul da marca — é o estado em que a máquina
     está fora da mão da pessoa, e isso tem que ser visível de canto de olho. */
  .barra.meet,.barra.atuando,.barra.explorando,.barra.explorar-aprovacao{border-color:var(--borda-primaria);box-shadow:0 16px 44px -16px rgba(0,0,0,.8), 0 0 22px var(--glow)}
  .barra.reuniao,.barra.olhando,.barra.assistindo{border-color:rgba(138,92,255,.4);box-shadow:0 16px 44px -16px rgba(0,0,0,.8), 0 0 18px var(--glow-ia)}

  /* Agente: foto quando o dn.os já mandou; senão a inicial, no tom do modo. */
  .agente{position:relative;flex:none;width:32px;height:32px}
  .foto{width:32px;height:32px;border-radius:11px;object-fit:cover;display:block;background:var(--superficie-2)}
  .inicial{width:32px;height:32px;border-radius:11px;display:flex;align-items:center;justify-content:center;
    background:var(--superficie-2);font-weight:600;font-size:14px;color:var(--texto-fraco)}
  /* display:flex/block prevalece sobre o hidden do navegador. Só foto OU
     inicial pode ocupar o espaço; as duas juntas empurravam a foto para fora. */
  .agente > [hidden]{display:none}
  .anel{position:absolute;inset:-3px;border-radius:14px;border:1.5px solid var(--primaria);opacity:.9;
    animation:pulso 1.8s ease-out infinite}
  .assistindo .anel,.reuniao .anel{border-color:var(--ia)}
  @keyframes pulso{0%{transform:scale(1);opacity:.9}70%{transform:scale(1.14);opacity:0}100%{opacity:0}}
  @media (prefers-reduced-motion: reduce){ .anel{animation:none;opacity:.55} }

  .textos{min-width:0;flex:1;display:flex;flex-direction:column;gap:1px}
  .titulo{font-weight:600;font-size:13px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sub{font-size:11px;line-height:1.3;color:var(--texto-fraco);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .quem{color:var(--primaria)}
  .assistindo .quem,.reuniao .quem{color:var(--ia)}

  /* Microfone: só na gravação, e só acende quando está ouvindo de verdade. */
  .mic{flex:none;width:22px;height:22px;border-radius:8px;display:none;align-items:center;justify-content:center;
    background:var(--superficie-2);color:var(--texto-fraco)}
  .mic.ligado{display:flex}
  .mic.ouvindo{color:var(--ia);box-shadow:0 0 12px var(--glow-ia)}
  .mic svg{width:12px;height:12px}

  /* Alça: mostra que dá para arrastar (a barra toda arrasta, fora dos botões). */
  .barra{cursor:grab}
  .barra[hidden]{display:none}
  .alca{flex:none;width:10px;height:26px;margin-right:-4px;display:grid;grid-template-columns:repeat(2,3px);gap:3px;align-content:center;justify-content:center;opacity:.45}
  .alca i{width:3px;height:3px;border-radius:50%;background:var(--texto-fraco);display:block}
  /* Minimizar: só na reunião. */
  button.mini{background:var(--superficie-2);color:var(--texto-fraco);border:1px solid var(--borda-neutra);
    width:28px;height:28px;padding:0;border-radius:9px;display:flex;align-items:center;justify-content:center}
  button.mini:hover{background:var(--superficie-2);color:var(--texto);border-color:rgba(138,92,255,.5)}
  button.mini svg{width:14px;height:14px}
  /* A bolinha: a janela vira 66×66 no canto direito (a casca muda o tamanho). */
  .bolha{position:fixed;left:4px;top:4px;width:56px;height:56px;border-radius:50%;cursor:pointer;
    background:var(--fundo);border:1px solid rgba(138,92,255,.45);box-shadow:0 0 18px var(--glow-ia);
    display:flex;align-items:center;justify-content:center}
  .bolha[hidden]{display:none}
  .bolha img,.bolha .ini{width:42px;height:42px;border-radius:50%;object-fit:cover;display:block}
  .bolha .ini{display:flex;align-items:center;justify-content:center;background:var(--superficie-2);font-weight:600;color:var(--texto-fraco)}
  .bolha > [hidden]{display:none}
  .bolha .anel{inset:3px;border-radius:50%;border-color:var(--ia)}
  .bolha .rec{position:absolute;top:1px;right:1px;width:12px;height:12px;border-radius:50%;background:var(--destrutiva);
    border:2px solid #080d1a;animation:pisca 1.4s ease-in-out infinite}
  @keyframes pisca{50%{opacity:.35}}
  @media (prefers-reduced-motion: reduce){ .bolha .rec{animation:none} }
  button{all:unset;cursor:pointer;flex:none;background:var(--destrutiva);color:#fff;font-weight:600;font-size:12px;
    padding:8px 14px;border-radius:999px;transition:background .15s}
  button[hidden]{display:none}
  button:hover{background:#ff2a20}
  button:focus-visible{outline:2px solid #fff;outline-offset:2px}
</style></head><body>
<div class="barra atuando" id="barra">
  <div class="alca" title="Arraste para mover" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="agente">
    <div class="inicial" id="inicial">dn</div>
    <img class="foto" id="foto" alt="" hidden>
    <i class="anel"></i>
  </div>
  <div class="textos">
    <b class="titulo" id="titulo"><span class="quem">dn.os</span> está usando o seu computador</b>
    <span class="sub" id="sub">preparando…</span>
  </div>
  <span class="mic" id="mic" title="Fale para anotar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><path d="M12 18v4"/></svg>
  </span>
  <button class="mini" id="mini" hidden title="Minimizar (a gravação continua)" aria-label="Minimizar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 12h12"/></svg>
  </button>
  <button id="aprovar" hidden style="background:var(--primaria)">Aprovar ação</button>
  <button id="parar" title="Parar">Parar</button>
</div>
<div class="bolha" id="bolha" hidden role="button" tabindex="0" aria-label="Gravando. Clique para abrir a barra.">
  <img id="bolha-foto" alt="" hidden><span class="ini" id="bolha-ini">dn</span><i class="anel"></i><i class="rec"></i>
</div>
<script>
(async () => {
  const ev = window.__TAURI__ && window.__TAURI__.event;
  if (!ev) return;
  const $ = (id) => document.getElementById(id);
  // "atuando" é o padrão: a barra nasceu da execução, e uma casca que ainda
  // não manda `modo` tem que continuar se comportando como antes.
  let modo = "atuando";
  // 01/10: só a reunião minimiza. Com o agente agindo, o Parar fica à vista.
  const MINIMIZA = ["reuniao", "meet"];
  let minimizada = false;
  const janela = window.__TAURI__.window && window.__TAURI__.window.getCurrentWindow();
  const arrastar = () => { try { janela && janela.startDragging(); } catch {} };
  function minimizar() {
    if (minimizada || !MINIMIZA.includes(modo)) return;
    minimizada = true;
    $("barra").hidden = true; $("bolha").hidden = false;
    ev.emit("dnos://barra-mac/minimizar", {});
  }
  function restaurar() {
    if (!minimizada) return;
    minimizada = false;
    $("bolha").hidden = true; $("barra").hidden = false;
    ev.emit("dnos://barra-mac/restaurar", {});
  }

  await ev.listen("dnos://barra-mac", (e) => {
    const p = e.payload || {};
    modo = ["assistindo", "olhando", "explorando", "explorar-aprovacao", "reuniao", "meet"].includes(p.modo) ? p.modo : "atuando";
    $("barra").className = "barra " + modo;
    $("mini").hidden = !MINIMIZA.includes(modo);
    // Mudou para um modo que não minimiza (o agente começou a agir): volta a barra.
    if (minimizada && !MINIMIZA.includes(modo)) restaurar();

    const quem = p.agente || "dn.os";
    $("aprovar").hidden = modo !== "explorar-aprovacao";
    const acao = modo.startsWith("explor") ? "tem uma sessão de aprendizado"
      : modo === "olhando" ? "pode olhar a janela autorizada"
      : modo === "assistindo" ? "está assistindo você"
      : modo === "reuniao" ? "está ouvindo esta reunião"
      : modo === "meet" ? "está na reunião do Meet"
      : "está usando o seu computador";
    $("titulo").innerHTML = '<span class="quem"></span> ' + acao + (p.titulo ? ' · <span class="oque"></span>' : "");
    $("titulo").querySelector(".quem").textContent = quem;
    if (p.titulo) $("titulo").querySelector(".oque").textContent = p.titulo;
    $("sub").textContent = p.sub || "";

    // Foto do agente (data URI, vinda do dn.os); sem foto, a inicial dele.
    if (p.foto) { $("foto").src = p.foto; $("foto").hidden = false; $("inicial").hidden = true; }
    else { $("foto").hidden = true; $("inicial").hidden = false; $("inicial").textContent = quem.slice(0, 2).toLowerCase(); }
    if (p.foto) { $("bolha-foto").src = p.foto; $("bolha-foto").hidden = false; $("bolha-ini").hidden = true; }
    else { $("bolha-foto").hidden = true; $("bolha-ini").hidden = false; $("bolha-ini").textContent = quem.slice(0, 2).toLowerCase(); }
    $("bolha").title = quem + " " + acao + " — clique para abrir a barra";

    // Microfone só nos modos que de fato abrem o microfone desta máquina — no
    // "meet" quem ouve é o Meet, e mostrar o ícone aqui seria mentira.
    $("mic").className = "mic" + (["assistindo", "reuniao"].includes(modo) ? " ligado" : "") + (p.ouvindo ? " ouvindo" : "");
    // O atalho só existe na execução; prometer atalho que não funciona é pior
    // que não prometer nada. Fora do corpo da barra: ocupava o espaço do texto.
    $("parar").textContent = modo === "assistindo" ? "Finalizar" : modo === "meet" ? "Sair" : "Parar";
    $("parar").title = modo.startsWith("explor") ? "Parar a exploração"
      : modo === "atuando" ? "Parar · ou Esc Esc"
      : modo === "olhando" ? "Parar a observação"
      : modo === "reuniao" ? "Encerrar a reunião e entregar a transcrição"
      : modo === "meet" ? "Tirar o agente da sala e entregar a transcrição"
      : "Finalizar demonstração e revisar";
  });

  // A criação da webview e o primeiro estado acontecem em processos
  // diferentes. Pedir o estado depois de instalar o listener elimina a janela
  // em que a barra podia parecer "atuando" durante uma gravação.
  await ev.emit("dnos://barra-mac/pronta", {});

  // Arrastar: a barra toda, menos os botões.
  $("barra").addEventListener("mousedown", (e) => {
    if (e.button !== 0 || e.target.closest("button")) return;
    arrastar();
  });
  $("mini").onclick = minimizar;
  // Bolinha: clique abre; arrastar (mais de 4 px) só move — a casca a devolve à borda.
  let toque = null;
  $("bolha").addEventListener("mousedown", (e) => { if (e.button === 0) toque = { x: e.screenX, y: e.screenY }; });
  $("bolha").addEventListener("mousemove", (e) => {
    if (toque && Math.abs(e.screenX - toque.x) + Math.abs(e.screenY - toque.y) > 4) { toque = null; arrastar(); }
  });
  $("bolha").addEventListener("mouseup", () => { if (toque) { toque = null; restaurar(); } });
  $("bolha").addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); restaurar(); } });

  let pendenteId = null;
  setInterval(async () => {
    if (!modo.startsWith("explor")) return;
    try { const s=await window.__TAURI__.core.invoke("explorar_computador",{acao:"estado"}); pendenteId=s.pendente?.requisicao || null; $("aprovar").hidden=!pendenteId; } catch {}
  }, 500);
  $("aprovar").onclick = async () => {
    if (!pendenteId) return;
    const requisicao=pendenteId;pendenteId=null;$("aprovar").hidden=true;
    try { await window.__TAURI__.core.invoke("explorar_computador",{acao:"aprovar",pedido:{requisicao}}); } catch {}
  };
  $("parar").onclick = () => {
    if (modo.startsWith("explor")) { window.__TAURI__.core.invoke("explorar_computador",{acao:"parar"}); return; }
    if (modo === "olhando") window.__TAURI__.core.invoke("olhar_computador", { acao: "parar" });
    else if (modo === "reuniao") ev.emit("dnos://reuniao/parar", {});
    else if (modo === "meet") ev.emit("dnos://reuniao-meet/sair", {});
    else if (modo === "assistindo") ev.emit("dnos://gravador/parar-pela-barra", {});
    else ev.emit("dnos://roteiro/parar", {});
  };
})();
</script></body></html>
